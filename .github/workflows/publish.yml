name: Publish reviewed simulation images
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed public main commit (40 lowercase hex characters)
        type: string
        required: true
      confirmation:
        description: PUBLISH-SIMULATION- followed by that exact commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: catalogue-publication
  cancel-in-progress: false
jobs:
  prepublication-validation:
    if: github.repository == 'quentinheylens/Maison-apps' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
  build-tested:
    needs: prepublication-validation
    if: github.repository == 'quentinheylens/Maison-apps' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVIEWED_COMMIT: ${{ inputs.source_commit }}
      PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refuse an unapproved policy, wrong commit or absent required reviewer
        env:
          CATALOG_PROTECTED_ENVIRONMENT: catalog-publication
        run: |
          python3 -I -B - <<'PY'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('catalog', 'tools/catalog.py')
          c=importlib.util.module_from_spec(spec); spec.loader.exec_module(c)
          policy=c.validate('.')
          c.exact_commit('.', os.environ['REVIEWED_COMMIT'])
          c.publication_allowed(policy, os.environ['REVIEWED_COMMIT'], os.environ['PUBLICATION_CONFIRMATION'], os.environ)
          c.protected_environment(policy)
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - run: python3 -I tools/catalog.py build --root . --commit "$REVIEWED_COMMIT" --output /tmp/tested-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tested-catalog/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish-approved:
    needs: build-tested
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: catalog-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REVIEWED_COMMIT: ${{ inputs.source_commit }}
      PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
      CATALOG_PROTECTED_ENVIRONMENT: catalog-publication
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tested-catalog
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exactly the tested images, never replace a version tag
        run: python3 -I tools/catalog.py publish --root . --commit "$REVIEWED_COMMIT" --confirmation "$PUBLICATION_CONFIRMATION" --artifacts /tmp/tested-catalog --output /tmp/released-catalog
      - id: subjects
        name: Read digest subjects without credentials or private metadata
        run: |
          python3 -I - <<'PY'
          import json,os
          images=json.load(open('/tmp/released-catalog/release-record.json'))['images']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for prefix,slug in [('diagnostic','maison_diagnostic_gateway_v6'),('deployment','maison_deployment_simulator')]:
              out.write(prefix+'_name='+images[slug]['image']+'\n'+prefix+'_digest='+images[slug]['digest']+'\n')
          PY
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.subjects.outputs.diagnostic_name }}
          subject-digest: ${{ steps.subjects.outputs.diagnostic_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.subjects.outputs.deployment_name }}
          subject-digest: ${{ steps.subjects.outputs.deployment_digest }}
          push-to-registry: true
      - name: Keep the exact release record even if later attestation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/released-catalog/release-record.json
          retention-days: 30
          if-no-files-found: error
      # A separate promotion PR verifies anonymous pulls and these attestations.
      # No store metadata, release, Green installation or update is automated here.
