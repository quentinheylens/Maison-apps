name: Validate real read-only diagnostic distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate both inventories and exercise the real reader boundary offline
        run: |
          python3 -I -B tools/catalog.py validate --root .
          python3 -I -B tools/real_catalog.py validate --root .
          python3 -B -m unittest discover -s real-diagnostic/tests -v
      - name: Build, test and archive the exact native image without production access
        run: python3 -I -B tools/real_catalog.py build --root . --commit "$GITHUB_SHA" --arch ${{ matrix.arch }} --output /tmp/real-tested
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-tested-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: /tmp/real-tested/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  vulnerability-audit:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: real-tested-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: /tmp/real-tested
          merge-multiple: true
      - name: Audit the exact tested image archives, never rebuild them
        run: python3 -I -B tools/real_catalog.py audit --root . --commit "$GITHUB_SHA" --artifacts /tmp/real-tested --output /tmp/real-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/real-audit/summary.json
            /tmp/real-audit/image-*.json
            /tmp/real-audit/database-status.json
          retention-days: 14
          if-no-files-found: warn
