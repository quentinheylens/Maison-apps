name: Validate simulation catalogue
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -I tools/catalog.py validate --root .
      - name: Build ARM64 and AMD64, test simulations without network, save exact images
        run: python3 -I tools/catalog.py build --root . --commit "$GITHUB_SHA" --output /tmp/tested-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-simulation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tested-catalog/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
